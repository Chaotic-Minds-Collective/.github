name: Shared CI (org)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        required: false
        type: string
        default: '20'
      working-directory:
        description: Subdirectory that contains package.json
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Detect package.json scripts
        id: pkg
        run: |
          if [ -f package.json ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            for s in lint build test; do
              if jq -e --arg s "$s" '.scripts[$s] != null' package.json > /dev/null 2>&1; then
                printf '%s=yes\n' "$s" >> "$GITHUB_OUTPUT"
              fi
            done
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.pkg.outputs.exists == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        if: steps.pkg.outputs.lint == 'yes'
        run: npm run lint

      - name: Build
        if: steps.pkg.outputs.build == 'yes'
        run: npm run build

      - name: Test
        if: steps.pkg.outputs.test == 'yes'
        run: npm test

  # Instant Discord alert when CI fails on a push to main. Pull-request
  # failures are intentionally excluded so PR builds don't spam the channel;
  # the daily monitor still reports them. Calls the org's reusable
  # notify-failure workflow with secrets: inherit, so it uses the same
  # org-level DISCORD_WEBHOOK_URL as the daily monitor.
  notify:
    name: Discord alert
    needs: [ci]
    if: ${{ failure() && github.event_name == 'push' }}
    uses: Chaotic-Minds-Collective/.github/.github/workflows/notify-failure.yml@main
    with:
      workflow-name: CI
    secrets: inherit
