name: One-shot - update repo descriptions

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  update-descriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Set repo descriptions via API
        env:
          GH_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN }}
        run: |
          set -uo pipefail
          fail=0
          while IFS='|' read -r repo desc; do
            [ -z "$repo" ] && continue
            payload=$(jq -cn --arg d "$desc" '{description: $d}')
            code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Chaotic-Minds-Collective/$repo" \
              -d "$payload")
            echo "$repo -> HTTP $code"
            if [ "$code" != "200" ]; then
              fail=1
              cat /tmp/resp.json
              echo
            fi
          done <<'DESCS'
.github|Org-wide automation: shared CI, onboarding bot, daily monitor, Discord failure alerts
chaotic-command|AI-driven Discord server builder and controller - central ops hub for Chaotic Minds Collective
chaotic-gaming|Chaotic Gaming - community platform and server infrastructure. Built by gamers, for gamers.
the-diagnostic-bay|The Diagnostic Bay - automotive diagnostics platform with AI-assisted troubleshooting, built by mechanics for mechanics
chaotic-solutions-site|Chaotic Solutions business website - Next.js static export on Cloudflare. Order from the chaos.
docs|Organization handbook and documentation, served via GitHub Pages
chaotic-command-docs|Documentation site for Chaotic Command (MDX)
chaotic-atlas-admin|Admin tools for the Atlas game server
chaotic-atlas-restart-overlay|Restart overlay for the Atlas game server
chaotic-atlas-status-host|Status page host for the Atlas game server
chaotic-admin-console|Admin console for the Atlas game server
ChaoticAtlasResourceMap|Chaotic Minds Atlas Resource Map
chaos-workflow-automator|Superseded - org automation lives in the .github repo
agent-visibility-template|Vite/TS + Cloudflare Worker template with AGENTS.md
whats_poppin_app|The Vibe App (paused)
DESCS
          exit $fail

      - name: Verify by reading back
        env:
          GH_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN }}
        run: |
          for repo in .github chaotic-command chaotic-gaming the-diagnostic-bay chaotic-solutions-site docs chaotic-command-docs chaotic-atlas-admin chaotic-atlas-restart-overlay chaotic-atlas-status-host chaotic-admin-console ChaoticAtlasResourceMap chaos-workflow-automator agent-visibility-template whats_poppin_app; do
            desc=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/Chaotic-Minds-Collective/$repo" | jq -r '.description // "(none)"')
            echo "$repo: $desc"
          done
