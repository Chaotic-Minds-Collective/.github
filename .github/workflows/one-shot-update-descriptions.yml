name: One-shot - update repo descriptions

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  update-descriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set repo descriptions via API
        env:
          GH_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN }}
        run: |
          set -uo pipefail
          fail=0
          while IFS='|' read -r repo desc; do
            [ -z "$repo" ] && continue
            payload=$(jq -cn --arg d "$desc" '{description: $d}')
            code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Chaotic-Minds-Collective/$repo" \
              -d "$payload")
            echo "$repo -> HTTP $code"
            if [ "$code" != "200" ]; then
              fail=1
              cat /tmp/resp.json
              echo
            fi
          done < .github/repo-descriptions.txt
          exit $fail

      - name: Verify by reading back
        env:
          GH_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN }}
        run: |
          fail=0
          while IFS='|' read -r repo desc; do
            [ -z "$repo" ] && continue
            code=$(curl -s -o /tmp/readback.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Chaotic-Minds-Collective/$repo")
            echo "$repo -> GET HTTP $code"
            if [ "$code" != "200" ]; then
              echo "Read-back failed for $repo"
              cat /tmp/readback.json
              echo
              fail=1
              continue
            fi
            actual_desc=$(jq -r '.description // ""' /tmp/readback.json)
            if [ "$actual_desc" != "$desc" ]; then
              echo "Description mismatch for $repo: expected '$desc', got '$actual_desc'"
              fail=1
            fi
          done < .github/repo-descriptions.txt
          exit $fail
